name: Build HSK Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Clean Android Project Structure Safely
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          rm -rf android
          flutter create --platforms=android --org com.ahm.hsk --project-name hsk .
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml

      - name: Get Dependencies, Patch All Legacy Plugins & Setup Icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 -c '
          from PIL import Image
          im = Image.open("assets/icon.png").convert("RGBA")
          w, h = im.size
          scale = 0.72
          nw, nh = int(w * scale), int(h * scale)
          im_resized = im.resize((nw, nh), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (w, h), (183, 28, 28, 255))
          canvas.paste(im_resized, ((w - nw) // 2, (h - nh) // 2), im_resized)
          canvas.save("assets/icon_padded.png")
          '
          flutter pub get
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle" -exec sed -i -E 's/compileSdkVersion (3[0-5]|flutter\.compileSdkVersion)/compileSdkVersion 36/g' {} +
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle" -exec sed -i -E 's/compileSdk[[:space:]]*=*[[:space:]]*(3[0-5]|flutter\.compileSdkVersion)/compileSdk = 36/g' {} +
          dart run flutter_launcher_icons

      - name: Configure Android Permissions, Background Audio & Gradle SDK
        run: |
          sed -i 's/android:label="[^"]*"/android:label="HSK"/g' android/app/src/main/AndroidManifest.xml

          python3 -c '
          m_path = "android/app/src/main/AndroidManifest.xml"
          with open(m_path, "r") as f:
              m = f.read()

          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
          """

          if "android.permission.INTERNET" not in m:
              m = m.replace("<application", perms + "\n    <application")

          # MainActivity-কে AudioServiceActivity-তে রূপান্তর (just_audio_background এর জন্য)
          m = m.replace("android:name=\".MainActivity\"", "android:name=\"com.ryanheise.audioservice.AudioServiceActivity\"")

          bg_services = """
                  <service
                      android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>
                  <receiver
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>
          """

          if "com.ryanheise.audioservice.AudioService" not in m:
              m = m.replace("</application>", bg_services + "\n    </application>")

          with open(m_path, "w") as f:
              f.write(m)

          b_path = "android/app/build.gradle.kts"
          with open(b_path, "r") as f:
              c = f.read()

          c = c.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          c = c.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          c = c.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 34")
          c = c.replace("buildTypes {", "buildTypes {\n        getByName(\"release\") {\n            signingConfig = signingConfigs.getByName(\"debug\")\n        }")

          with open(b_path, "w") as f:
              f.write(c)
          '

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HSK-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
