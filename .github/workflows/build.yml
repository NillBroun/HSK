name: Build HSK Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create Android Platform Files
        run: flutter create . --org com.ahm.hsk --project-name hsk
      - name: Add Internet Permission to AndroidManifest
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
      - name: Get Dependencies & Generate App Icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Build Release APK
        run: flutter build apk --release
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSK-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
