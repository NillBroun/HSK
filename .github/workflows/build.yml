name: Build HSK Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Recreate Clean Android Project Structure
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          rm -rf android
          flutter create --platforms=android --org com.ahm.hsk .
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml

      - name: Get Dependencies, Patch All Legacy Plugins & Setup Icons
        run: |
          flutter pub get
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle" -exec sed -i -E 's/compileSdkVersion[[:space:]]+(3[0-5]|flutter\.compileSdkVersion)/compileSdkVersion 36/g' {} +
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle" -exec sed -i -E 's/compileSdk[[:space:]]*=*[[:space:]]*(3[0-5]|flutter\.compileSdkVersion)/compileSdk = 36/g' {} +
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle.kts" -exec sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*(3[0-5]|flutter\.compileSdkVersion)/compileSdk = 36/g' {} +
          python3 -m pip install --quiet Pillow
          python3 -c '
          from PIL import Image
          img = Image.open("assets/icon.png").convert("RGBA")
          canvas = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          resized = img.resize((660, 660), Image.LANCZOS)
          canvas.paste(resized, (182, 182), resized)
          canvas.save("assets/icon_padded.png")
          '
          dart run flutter_launcher_icons

      - name: Configure Android 36 SDK, Background Audio Service & Permissions
        run: |
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9a-zA-Z_.]+/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9a-zA-Z_.]+/minSdk = 24/g' android/app/build.gradle.kts
          sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9a-zA-Z_.]+/targetSdk = 34/g' android/app/build.gradle.kts

          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/raw
          cat << 'EOF' > android/app/src/main/res/raw/keep.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools"
              tools:keep="@drawable/audio_service_*" />
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/audio_service_ic_play.xml
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android" android:src="@android:drawable/ic_media_play" android:tint="#D32F2F"/>
          EOF
          cat << 'EOF' > android/app/src/main/res/drawable/audio_service_ic_pause.xml
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android" android:src="@android:drawable/ic_media_pause" android:tint="#D32F2F"/>
          EOF
          cat << 'EOF' > android/app/src/main/res/drawable/audio_service_ic_skip_previous.xml
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android" android:src="@android:drawable/ic_media_previous" android:tint="#D32F2F"/>
          EOF
          cat << 'EOF' > android/app/src/main/res/drawable/audio_service_ic_skip_next.xml
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android" android:src="@android:drawable/ic_media_next" android:tint="#D32F2F"/>
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.VIBRATE"/>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>

              <application
                  android:label="HSK"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name="com.ryanheise.audioservice.AudioServiceActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true"
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true"
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSK-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
