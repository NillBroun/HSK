name: hsk
description: Universal HSK 1-6 Chinese Audio & Study Companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  archive: ^3.6.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  just_audio: ^0.9.42
  syncfusion_flutter_pdfviewer: ^28.1.33
  file_picker: ^8.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#B71C1C"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/group1.jpg
    - assets/group2.jpg
    - assets/group3.jpg
