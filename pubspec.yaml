name: hsk_study_app
description: "Offline HSK 1-6 Chinese Vocabulary, PDF & Audio Study App by AHM"
publish_to: 'none'

version: 1.2.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  just_audio: ^0.9.38
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21
  http: ^1.2.1
  path_provider: ^2.1.3
  archive: ^3.6.1
  pdfx: ^2.6.0
  file_picker: ^8.0.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon_padded.png"
  adaptive_icon_background: "#B71C1C"
  adaptive_icon_foreground: "assets/icon_padded.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/icon_padded.png
    - assets/group1.jpg
    - assets/group2.jpg
    - assets/group3.jpg
    - assets/vocab/hsk1.json
    - assets/vocab/hsk2.json
    - assets/vocab/hsk3.json
    - assets/vocab/hsk4_a.json
    - assets/vocab/hsk4_b.json
    - assets/vocab/hsk5_a.json
    - assets/vocab/hsk5_b.json
    - assets/vocab/hsk6_a.json
    - assets/vocab/hsk6_b.json
    - assets/vocab/departments.json
    - assets/vocab/daily_nature_a.json
    - assets/vocab/daily_nature_b.json
    - assets/vocab/hanzi_course_300.json
    - assets/vocab/hsk1_dialogues.json
    - assets/vocab/hsk2_dialogues.json
    - assets/vocab/pinin-chart.json
