name: hsk
description: Universal HSK 1-6 Chinese Audio & Study Companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  archive: ^3.4.10
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  just_audio: ^0.9.36
  syncfusion_flutter_pdfviewer: ^24.2.9
  file_picker: ^6.1.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#B71C1C"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/group1.jpg
    - assets/group2.jpg
    - assets/group3.jpg
