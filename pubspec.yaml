name: hsk_study_app
description: Offline-first HSK 1-6 & Workplace Mandarin Chinese Learning App by AHM.
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  http: ^1.2.2
  archive: ^3.6.1
  just_audio: ^0.9.40
  pdfx: ^2.8.0
  file_picker: ^8.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/vocab/
    - assets/
